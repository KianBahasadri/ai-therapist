<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ai-therapist debug</title>
    <script>
      (function () {
        var theme = localStorage.getItem("theme");
        if (
          theme === "dark" ||
          (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="debug-page">
      <header class="debug-header">
        <div>
          <p class="debug-kicker">Therapist perspective</p>
          <h1>Debug history</h1>
        </div>
        <div class="debug-actions">
          <a class="debug-link" href="/">Main menu</a>
          <button id="simulate-user" class="primary" type="button">Simulate user response</button>
        </div>
      </header>

      <section class="debug-grid">
        <article class="debug-panel debug-transcript-panel">
          <div class="debug-panel-header">
            <h2>Conversation</h2>
            <p id="conversation-count">0 messages</p>
          </div>
          <div id="debug-transcript" class="debug-transcript"></div>
          <form id="debug-user-form" class="debug-user-form">
            <textarea id="debug-user-input" rows="3" placeholder="Send a user message in debug history"></textarea>
            <button id="debug-user-send" class="primary" type="submit">Send as user</button>
          </form>
        </article>

        <aside class="debug-side">
          <article class="debug-panel">
            <div class="debug-panel-header">
              <h2>History</h2>
            </div>
            <dl id="history-meta" class="debug-meta"></dl>
          </article>

          <article class="debug-panel">
            <div class="debug-panel-header">
              <h2>Running notes</h2>
            </div>
            <pre id="running-notes" class="debug-pre"></pre>
          </article>

          <article class="debug-panel">
            <div class="debug-panel-header">
              <h2>Assessments</h2>
            </div>
            <div id="assessment-list" class="assessment-list"></div>
          </article>
        </aside>
      </section>
    </main>

    <script src="/assets/debug.js"></script>
  </body>
</html>
